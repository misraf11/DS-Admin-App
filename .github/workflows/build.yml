name: Build DS Admin APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/ds-admin-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'jqs85YU92NzMlWUs19cHs1IL' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'jqs85YU92NzMlWUs19cHs1IL' }}
          KEY_ALIAS: dsadmin
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DS-Admin-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DS-Admin-APK
          path: DS-Admin-*.apk
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DS Admin v1.0.${{ github.run_number }}
          files: DS-Admin-v1.0.${{ github.run_number }}.apk
          body: "DS Admin Android app — build ${{ github.run_number }} (${{ github.sha }})"

      - name: Store APK on apk-builds branch
        run: |
          mkdir /tmp/apkbranch && cp DS-Admin-*.apk /tmp/apkbranch/DS-Admin-latest.apk
          cd /tmp/apkbranch
          git init -q -b apk-builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          echo "v1.0.${{ github.run_number }} ${{ github.sha }}" > VERSION.txt
          git add -A && git commit -q -m "APK build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-builds
